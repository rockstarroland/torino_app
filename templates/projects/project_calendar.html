{% extends "base.html" %}
{% block title %}Project Calendar{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>

<style>
    #calendar { min-height: 760px; }
    .fc-event { border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: none; font-weight: 500; }
    .fc-event:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.22); }
    .filter-bar { background: #f8f9fa; border-radius: 12px; }
    .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
</style>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1">Project Calendar</h1>
            <p class="text-muted mb-0">Green = Orders • Orange = Projects / Installs</p>
        </div>
        <a href="{{ url_for('projects.projects_list') }}" class="btn btn-outline-secondary">← Back to Projects</a>
    </div>

    <div class="card shadow-sm mb-4 filter-bar">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-auto">
                    <label class="form-label text-muted small">Type</label>
                    <div class="btn-group" role="group">
                        <button class="btn btn-primary active" id="filter-all">All</button>
                        <button class="btn btn-outline-success" id="filter-materials">Materials (Orders)</button>
                        <button class="btn btn-outline-warning" id="filter-installs">Projects / Installs</button>
                    </div>
                </div>
                <div class="col-auto">
                    <label class="form-label text-muted small">Status</label>
                    <select id="status-filter" class="form-select">
                        <option value="">All Statuses</option>
                        {% for status in ORDER_STATUSES %}
                        <option value="{{ status }}">{{ status }}</option>
                        {% endfor %}
                        {% for status in PROJECT_STATUSES %}
                        <option value="{{ status }}">{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label text-muted small">Supplier</label>
                    <select id="supplier-filter" class="form-select">
                        <option value="">All Suppliers</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.name }}">{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col">
                    <label class="form-label text-muted small">Search</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Project, customer, supplier, or status...">
                </div>
                <div class="col-auto">
                    <button id="clear-filters" class="btn btn-outline-secondary">Clear Filters</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    let calendar;
    let allEvents = [];

    fetch('{{ url_for("projects.project_calendar_data") }}')
        .then(response => response.json())
        .then(events => {
            allEvents = events;
            // Your full calendar JS code goes here
            // (the original script you had)
        });
});
</script>
{% endblock %}
