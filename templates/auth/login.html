{% extends "base.html" %}
{% block title %}Login - Torino Tile{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            <h2 class="text-center fw-bold mb-4 torino-brand">TORINO TILE</h2>
            
            <form method="POST" novalidate>
                {{ form.hidden_tag() }}   <!-- This includes the CSRF token automatically -->

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    {{ form.username(class="form-control bg-dark text-white") }}
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    {{ form.password(class="form-control bg-dark text-white") }}
                </div>

                <button type="submit" class="btn btn-success w-100 py-3">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
