{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}

{% block content %}
<h2>Edit Customer</h2>
<form method="POST">
    {{ csrf_token() }}
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" value="{{ customer.name }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="tel" name="phone" value="{{ customer.phone or '' }}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" value="{{ customer.email or '' }}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="3">{{ customer.address or '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="4">{{ customer.notes or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
