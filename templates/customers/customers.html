{% extends "base.html" %}
{% block title %}Customers{% endblock %}

{% block content %}
<h2>Customers</h2>
<a href="{{ url_for('customers.add_customer') }}" class="btn btn-primary mb-3">Add New Customer</a>

<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td><a href="{{ url_for('customers.customer_detail', customer_id=c.id) }}">{{ c.name }}</a></td>
            <td>{{ c.phone or '-' }}</td>
            <td>{{ c.email or '-' }}</td>
            <td>
                <a href="{{ url_for('customers.edit_customer', customer_id=c.id) }}" class="btn btn-sm btn-warning">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
